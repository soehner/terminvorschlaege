<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../options/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Terminvorschläge</h1>
  <form id="form">
    <div class="grid">
      <label>Anzahl
        <input type="number" id="count" min="1" max="20" required>
      </label>
      <label>Dauer (Min.)
        <input type="number" id="duration" min="5" max="600" step="5" required>
      </label>
      <label>Frühestens ab
        <input type="date" id="from">
      </label>
      <label>Zeitraum (Tage)
        <input type="number" id="horizon" min="1" max="120" required>
      </label>
    </div>
    <label class="full">Titel im Kalender
      <input type="text" id="title" placeholder="Betreff der E-Mail">
    </label>
    <label class="full">Reservieren in Kalender
      <select id="calendar"></select>
    </label>
  </form>

  <div id="status" class="status"></div>
  <ul id="slots" class="slots"></ul>

  <div class="buttons">
    <button type="button" id="recalc" class="secondary" title="Abgewählte Termine durch neue ersetzen">Neu berechnen</button>
    <button type="button" id="apply" disabled>Reservieren &amp; einfügen</button>
  </div>
  <p class="hint">Abgewählte Vorschläge werden bei „Neu berechnen“ ersetzt. <a href="#" id="openOptions">Einstellungen</a></p>
  <script src="popup.js"></script>
</body>
</html>
